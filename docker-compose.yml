name: sudoku-solver-modern

services:
  backend:
    build: .
    # Distinct from the old repo's jgaltidor/sudoku-solver-backend -- this is
    # an independent image, not a new tag of that one. Lets scripts/publish.sh
    # push a build here via `docker compose push`.
    image: jgaltidor/sudoku-solver-modern-backend:latest
    ports:
      - "8000:8000"
    volumes:
      # Live-reload dev loop: edits under src/ take effect immediately
      # (uvicorn --reload, see Dockerfile) without an image rebuild.
      - ./src:/app/src

  frontend:
    build: ./frontend
    image: jgaltidor/sudoku-solver-modern-frontend:latest
    ports:
      - "3000:3000"
    environment:
      # Compose's embedded DNS resolves the "backend" service name.
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      # Anonymous volume so the container's own Linux-native node_modules
      # (installed at image build time) isn't shadowed by the host's.
      - /app/node_modules
