[project]
name = "sudoku-solver"
version = "0.1.0"
description = "Modern Sudoku solver backend (OR-Tools CP-SAT)"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
