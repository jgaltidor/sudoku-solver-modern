name: CI

"on":
  push:
  pull_request:

# None of these jobs need to write anything back to the repo (no auto-commit,
# no release, no PR comment) -- explicit read-only default rather than
# whatever the org's broader GITHUB_TOKEN default happens to be.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      - name: Build combined image
        run: docker build -f Dockerfile.combined -t jgaltidor/sudoku-solver-modern:latest .

  # Catches malformed Terraform/Packer in deploy/ before it reaches a real
  # `terraform apply` -- the IaC analogue of the docker-build job. No AWS
  # credentials: `validate` and `fmt` are offline checks (init runs with
  # -backend=false and still needs the provider plugin, which is a public
  # download).
  deploy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive deploy/

      - name: Terraform validate
        working-directory: deploy/terraform
        run: |
          terraform init -backend=false
          terraform validate

      - uses: hashicorp/setup-packer@v3

      - name: Packer fmt + validate
        working-directory: deploy/packer
        run: |
          packer fmt -check .
          packer init .
          packer validate .
