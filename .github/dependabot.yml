version: 2
updates:
  # Backend: pyproject.toml + uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # Frontend: package.json + package-lock.json
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  # GitHub Actions used in .github/workflows/ci.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base images: python:3.12-slim + ghcr.io/astral-sh/uv (backend Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image: node:20 (frontend Dockerfile)
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
